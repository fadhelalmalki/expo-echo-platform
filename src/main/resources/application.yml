spring:
  application:
    name: expo-echo-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:unset}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
          temperature: 0.4

server:
  port: ${PORT:8080}
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    enabled: ${AI_ENABLED:true}
  site:
    center-lat: ${SITE_CENTER_LAT:24.878738040594087}
    center-lng: ${SITE_CENTER_LNG:46.70069308320736}
  recommendation:
    default-radius-meters: 600
    max-radius-meters: 3000
    walk-speed-meters-per-minute: 80
    reminder-lead-minutes: 10
